aid: flovision-formerly-flowaste
name: Flovision (formerly FloWaste)
description: 'Flovision Solutions (formerly FloWaste) builds AI-powered computer-vision systems for
  food production, using cameras and machine learning to measure product on the line for yield
  improvement, quality control, and staff-performance tracking. Its FloVision Nano (conveyor
  measurement, KPI reporting, and benchmarking) and FloVision Pro (real-time operator guidance at
  processing stations) products feed a hosted FloVision Analytics dashboard, and the company reports
  processing over 23 million kg of food and recovering up to 1.5% of production yield. Insight
  Partners portfolio company in the manufacturing / food-tech sector; no public developer API or
  documentation surface has been published to date.'
